name: Bug report
description: Report reproducible incorrect behavior in llm-exec-core.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: >-
        Public Issues are the only public intake channel. Do not prepare or
        submit code until the Issue is accepted and the maintainer explicitly
        dispatches your actor/session, semantic scope, and branch/PR delivery.
  - type: input
    id: version
    attributes:
      label: Package version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python version, and dependency versions.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed semantic scope
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: minimal_reproduction
    attributes:
      label: Minimal reproduction
      description: Redact keys, tokens, prompts, and other sensitive data.
      render: python
  - type: textarea
    id: impact
    attributes:
      label: Compatibility and security impact
    validations:
      required: true
  - type: dropdown
    id: risk_class
    attributes:
      label: Risk class
      description: High risk includes workflow, permissions, secrets, security, external code, breaking public API, and catalog changes.
      options:
        - Ordinary source/test/docs/config
        - High risk
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: Rollback and recovery
    validations:
      required: true
  - type: checkboxes
    id: contribution_boundary
    attributes:
      label: Contribution boundary
      options:
        - label: I will wait for an explicit maintainer dispatch before preparing code.
          required: true
