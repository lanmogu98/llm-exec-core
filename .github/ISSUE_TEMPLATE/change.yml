name: Change request
description: Propose a scoped feature, compatibility, or governance change.
title: "[Change]: "
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: >-
        Public Issues are the only public intake channel. Code preparation and
        contribution require an accepted Issue and explicit maintainer dispatch
        naming the actor/session, semantic scope, and branch/PR delivery.
  - type: textarea
    id: objective
    attributes:
      label: Objective
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation and evidence
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Compatibility and security impact
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Risks and dependencies
    validations:
      required: true
  - type: dropdown
    id: risk_class
    attributes:
      label: Risk class
      description: High risk includes workflow, permissions, secrets, security, external code, breaking public API, and catalog changes.
      options:
        - Ordinary source/test/docs/config
        - High risk
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: Rollback and recovery
    validations:
      required: true
  - type: checkboxes
    id: contribution_boundary
    attributes:
      label: Contribution boundary
      options:
        - label: I will wait for an explicit maintainer dispatch before preparing code.
          required: true
